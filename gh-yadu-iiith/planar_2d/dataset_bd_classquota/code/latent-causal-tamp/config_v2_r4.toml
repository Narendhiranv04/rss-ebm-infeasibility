# P6 R4 overlay of config_v2.toml (identical except [proposal].move_cap = 4); config_v2.toml itself is unchanged.
# INITIAL_SCENE_ORDERED_ONE_SHOT_V2 overlay (Methodology v1.6, Guide v1.8 §4; G4D).
# Validated by config.load_config_v2 against SCHEMA_V2; unknown or missing keys fail.
# Physics, robot, planner and skill budgets stay in config.toml (unchanged, so every
# V1 config hash and archived-plan guard is unaffected). Sampler, model and energy
# sections arrive with G4B/G5, when code first reads them.

[protocol]
name = "INITIAL_SCENE_ORDERED_ONE_SHOT_V2"
schema_version = 1
proposal_observation = "INITIAL_ONLY"
order_source = "PROPOSED_SEQUENCE"
executor_may_reorder = false
target_feedback_to_selection = false
max_primary_target_evaluations = 1
target_end_policy = "GOAL_AND_SAFE_RETREAT"   # addendum A1 contract; same action context as G4A SAFE_RETREAT
home_return = "SEPARATE_DIAGNOSTIC"
move_once = true

[proposal]
source = "MANUAL_OR_DETERMINISTIC_SEQUENCES"   # G4D: no learned scorer exists yet
move_cap = 4                                   # P6 R4 overlay: up to four distinct relocations
max_candidates_to_verify = 12
task_score_threshold = 0.5                     # deterministic geometric score (goal occupancy), as in V1
rank = ["move_count", "predicted_joint_travel", "endpoint_distance", "feasibility_energy", "signature"]

[cost]
policy = "FIRST_RELOCATION_WITNESS_NORMALIZED_JOINT_TRAVEL_V1"
relocation_backend = "FIXED_ORDER_GREEDY_SKILL2D_V1"   # verify.plan_fixed_order with repair2d skill budget
waypoints_within_joint_limits = true           # joint-linear segments inside the limits: no wrap can occur

[explanation]
counterfactual_appearance = "INITIAL_ANCHOR"
max_omission_subset = 2                        # singleton and pair omissions; the full set is the empty repair
max_tested_subsets = 16                        # finite explanation budget per (query, sequence)
